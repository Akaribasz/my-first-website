<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AkaRibas.com</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>

<body>

   <header class="navbar">
        <button class="website-name" onclick='location.href="index.html"'>
            AlsoKnowAsRibas.com
        </button>

        <nav class="nav-links">
            <a class="about-btn" href="About.html">About</a>
            <a class="articles-btn" href="ribas-articles-page.html">Articles</a>
            <a class="github" href="https://github.com/Akaribasz" target="_blank" aria-label="GitHub">
                <img class="gitLogo" src="Photos/github_logo_icon_229278.webp" alt="GitHub">
            </a>
            <input class="searchbar" type="text" placeholder="Search..." id="searchbarr">
            
            <div class="trilho" id="trilho">
                <div class="indicador"></div>
            </div>
        </nav>
    </header>
   <footer class="end-page">
        © 2026 Luiz Ribas - All Rights Reserved
    </footer>
    
    <script>
        const trilho = document.getElementById('trilho');
        const body = document.body;

        if (localStorage.getItem('theme') === 'dark') {
            trilho.classList.add('dark');
            body.classList.add('dark');
        }

        trilho.addEventListener('click', () => {
            trilho.classList.toggle('dark');
            body.classList.toggle('dark');
            if (body.classList.contains('dark')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        });
    </script>
</body>
